<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Lấy Key Bảo Mật</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); text-align: center; max-width: 450px; width: 100%; }
        .timer-box { font-size: 14px; color: #d9534f; font-weight: bold; margin-bottom: 10px; background: #fff0f0; padding: 8px; border-radius: 5px; }
        .key-box { font-size: 17px; font-weight: bold; color: #28a745; background: #e8f5e9; padding: 12px; border-radius: 8px; border: 2px dashed #28a745; margin: 15px 0; letter-spacing: 1px; word-break: break-all; font-family: monospace; }
        .btn { background: #007bff; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }
        .btn:hover { background: #0056b3; }
        .expired-msg { color: red; font-weight: bold; display: none; margin-top: 10px; }
        .provider-title { background: #17a2b8; color: white; display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
        .error-screen { color: #d9534f; font-weight: bold; padding: 20px; }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <div class="provider-title" id="provider-badge">Nhiệm Vụ</div>
        <h3>🎉 Vượt Link Thành Công!</h3>
        
        <div class="timer-box" id="timer-display">⏱️ Key sẽ tự hủy sau: <span id="countdown">30</span> giây</div>

        <div class="key-box" id="key-text">Đang tạo key bảo mật...</div>
        
        <button class="btn" id="copy-btn" onclick="copyAndDestroyKey()">📋 Sao Chép Key Bảo Mật</button>

        <p class="expired-msg" id="expired-text">⚠️ Key đã tự hủy! Vui lòng vượt link lại để lấy mã mới.</p>
    </div>

    <script>
        // --- CHỐNG GIAN LẬN: KIỂM TRA NGUỒN TRUY CẬP (REFERER) ---
        // Các domain được phép chuyển hướng tới trang lấy key này (Thêm domain của bạn vào đây)
        const ALLOWED_DOMAINS = ["link4m.org", "link4sub.com", "vuotnhanh.com", "yeumoney.com", "layma.net", "github.io"];
        let referer = document.referrer;
        let isValidAccess = false;

        try {
            if (!referer) {
                // Cho phép chạy local hoặc truy cập trực tiếp khi test (bạn có thể siết chặt bằng cách bỏ qua dòng này)
                isValidAccess = true; 
            } else {
                let refDomain = new URL(referer).hostname;
                if (ALLOWED_DOMAINS.some(domain => refDomain.includes(domain))) {
                    isValidAccess = true;
                }
            }
        } catch (e) {
            isValidAccess = true;
        }

        // Nếu cố tình nhập thẳng link getkey mà không qua các trang rút gọn -> Chặn hoàn toàn
        if (!isValidAccess) {
            document.getElementById("main-card").innerHTML = `
                <div class="error-screen">
                    <h2>⚠️ TRUY CẬP BỊ TỪ CHỐI!</h2>
                    <p>Bạn phải hoàn thành việc vượt link qua các nhà cung cấp chính thức mới được cấp Key bảo mật.</p>
                </div>
            `;
        } else {
            const urlParams = new URLSearchParams(window.location.search);
            const provider = urlParams.get('provider') || 'link4m';
            document.getElementById("provider-badge").innerText = "Nhiệm Vụ: " + provider;

            // HÀM TẠO KEY BẢO MẬT ĐỒNG BỘ CHUẨN 100% VỚI INDEX.HTML
            function generateSecureKey(prov) {
                let d = new Date();
                let dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
                let secretSalt = "TRONG_KEY_SECRET_2026";
                let rawText = prov.toUpperCase() + "_" + dateStr + "_" + secretSalt;
                
                let hash = 0;
                for (let i = 0; i < rawText.length; i++) {
                    hash = ((hash << 5) - hash) + rawText.charCodeAt(i);
                    hash |= 0;
                }
                let hexCode = Math.abs(hash).toString(16).toUpperCase().padStart(8, 'X');
                let subHash = Math.abs(hash * 31).toString(16).toUpperCase().padStart(4, 'Y');

                return `${prov.toUpperCase()}-${hexCode}-${subHash}-${dateStr}`;
            }

            let currentKey = generateSecureKey(provider);
            document.getElementById("key-text").innerText = currentKey;

            let timeLeft = 30;
            let isCopied = false;

            const timerInterval = setInterval(function() {
                timeLeft--;
                document.getElementById("countdown").innerText = timeLeft;
                if (timeLeft <= 0) destroyKey();
            }, 1000);

            window.copyAndDestroyKey = function() {
                if (isCopied || timeLeft <= 0) return;
                let keyText = document.getElementById("key-text").innerText;
                navigator.clipboard.writeText(keyText);
                alert("Đã sao chép Key thành công!\n(Key đã tự hủy để chống gian lận)");
                isCopied = true;
                destroyKey();
            };

            function destroyKey() {
                clearInterval(timerInterval);
                document.getElementById("key-text").style.display = "none";
                document.getElementById("copy-btn").style.display = "none";
                document.getElementById("timer-display").style.display = "none";
                document.getElementById("expired-text").style.display = "block";
            }
        }
    </script>

</body>
</html>
