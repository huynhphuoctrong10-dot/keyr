<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lấy Key Bảo Mật (One-Time)</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); text-align: center; max-width: 450px; width: 100%; }
        .timer-box { font-size: 14px; color: #d9534f; font-weight: bold; margin-bottom: 10px; background: #fff0f0; padding: 8px; border-radius: 5px; }
        .key-box { font-size: 16px; font-weight: bold; color: #28a745; background: #e8f5e9; padding: 12px; border-radius: 8px; border: 2px dashed #28a745; margin: 15px 0; letter-spacing: 1px; word-break: break-all; font-family: monospace; }
        .btn { background: #007bff; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }
        .btn:hover { background: #0056b3; }
        .expired-msg { color: red; font-weight: bold; display: none; margin-top: 10px; }
        .provider-title { background: #17a2b8; color: white; display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
        .error-screen { color: #d9534f; font-weight: bold; padding: 20px; }
    </style>

    <!-- FIREBASE SDK ĐỂ LƯU TRỮ VÀ KIỂM TRA KEY MỘT LẦN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD1_YT9MACIh28WuJOC-9ih3Xk-CSt3LQ0",
            authDomain: "web1-dcd7a.firebaseapp.com",
            projectId: "web1-dcd7a",
            storageBucket: "web1-dcd7a.firebasestorage.app",
            messagingSenderId: "93128679432",
            appId: "1:93128679432:web:015237d83547b8ed8231bd",
            measurementId: "G-SGCT4RMT2S"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.FB = { doc, setDoc, getDoc };
    </script>
</head>
<body>

    <div class="card" id="main-card">
        <div class="provider-title" id="provider-badge">Nhiệm Vụ</div>
        <h3>🎉 Vượt Link Thành Công!</h3>
        
        <div class="timer-box" id="timer-display">⏱️ Key bảo mật sẽ tự hủy sau: <span id="countdown">30</span> giây</div>

        <div class="key-box" id="key-text">Đang tạo mã độc quyền...</div>
        
        <button class="btn" id="copy-btn" onclick="copyAndDestroyKey()">📋 Sao Chép Key & Kích Hoạt 1 Lần</button>

        <p class="expired-msg" id="expired-text">⚠️ Key đã được sử dụng hoặc hết hạn! Vui lòng thực hiện vượt link mới.</p>
    </div>

    <script>
        // === HÃY SỬA TÊN BIẾN NÀY CHO TỪNG FILE TƯƠNG ỨNG ===
        // - File link4m.html   -> để là 'link4m'
        // - File vuotnhanh.html -> để là 'vuotnhanh'
        // - File yeumoney.html  -> để là 'yeumoney'
        // - File layma.html     -> để là 'layma'
        // - File link4sub.html  -> để là 'link4sub'
        const PROVIDER_NAME = 'link4m'; 
        // ====================================================

        document.getElementById("provider-badge").innerText = "Phân Loại: " + PROVIDER_NAME.toUpperCase();
        let currentKey = "";

        async function initUniqueKey() {
            let d = new Date();
            let dateStr = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
            
            // Tạo đoạn mã random độc quyền cho phiên này
            let randomHex = Math.random().toString(36).substring(2, 10).toUpperCase();
            currentKey = `${PROVIDER_NAME.toUpperCase()}-${randomHex}-${dateStr}`;
            
            document.getElementById("key-text").innerText = currentKey;

            // Lưu trạng thái key chưa sử dụng lên Firestore
            try {
                if (window.db && window.FB) {
                    let keyRef = window.FB.doc(window.db, "used_keys", currentKey);
                    await window.FB.setDoc(keyRef, { provider: PROVIDER_NAME, used: false, time: new Date().toLocaleString() });
                }
            } catch(e) {}
        }

        setTimeout(initUniqueKey, 400);

        let timeLeft = 30;
        let isCopied = false;

        const timerInterval = setInterval(function() {
            timeLeft--;
            document.getElementById("countdown").innerText = timeLeft;
            if (timeLeft <= 0) destroyKey();
        }, 1000);

        window.copyAndDestroyKey = async function() {
            if (isCopied || timeLeft <= 0 || !currentKey) return;
            
            navigator.clipboard.writeText(currentKey);
            alert("Đã sao chép Key bảo mật thành công!\n(Key này chỉ có hiệu lực sử dụng 1 lần duy nhất).");
            isCopied = true;

            // Đánh dấu key đã được sử dụng trên Cloud để chặn người thứ 2 dùng lại
            try {
                if (window.db && window.FB) {
                    let keyRef = window.FB.doc(window.db, "used_keys", currentKey);
                    await window.FB.setDoc(keyRef, { provider: PROVIDER_NAME, used: true, time: new Date().toLocaleString() }, { merge: true });
                }
            } catch(e) {}

            destroyKey();
        };

        function destroyKey() {
            clearInterval(timerInterval);
            document.getElementById("key-text").style.display = "none";
            document.getElementById("copy-btn").style.display = "none";
            document.getElementById("timer-display").style.display = "none";
            document.getElementById("expired-text").style.display = "block";
        }
    </script>
</body>
</html>
