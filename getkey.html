<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Lấy Key Security</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); text-align: center; max-width: 450px; width: 100%; }
        .timer-box { font-size: 14px; color: #d9534f; font-weight: bold; margin-bottom: 10px; background: #fff0f0; padding: 8px; border-radius: 5px; }
        .key-box { font-size: 18px; font-weight: bold; color: #28a745; background: #e8f5e9; padding: 12px; border-radius: 8px; border: 2px dashed #28a745; margin: 15px 0; letter-spacing: 1.5px; word-break: break-all; font-family: monospace; }
        .btn { background: #007bff; color: white; padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; }
        .btn:hover { background: #0056b3; }
        .expired-msg { color: red; font-weight: bold; display: none; margin-top: 10px; }
        .error-screen { color: #d9534f; font-weight: bold; padding: 20px; }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <h3>🎉 Vượt Link Thành Công!</h3>
        
        <div class="timer-box" id="timer-display">⏱️ Key sẽ biến mất sau: <span id="countdown">30</span> giây</div>

        <div class="key-box" id="key-text">Đang tạo key ngẫu nhiên...</div>
        
        <button class="btn" id="copy-btn" onclick="copyAndDestroyKey()">📋 Sao Chép Key Bảo Mật</button>

        <p class="expired-msg" id="expired-text">⚠️ Key đã bị xóa hoặc hết hạn! Vui lòng vượt link lại để lấy Key mới.</p>
    </div>

    <script>
        const EXACT_DOMAINS = [
            "link4m.org", "link4sub.com", "vuotnhanh.com", "yeumoney.com", "layma.net", "huynhphuoctrong10-dot.github.io"
        ];

        let referer = document.referrer;
        let isMatched = false;

        try {
            let refUrl = new URL(referer);
            if (EXACT_DOMAINS.includes(refUrl.hostname)) {
                isMatched = true;
            }
        } catch (e) {
            isMatched = false;
        }

        if (!isMatched) {
            document.getElementById("main-card").innerHTML = `
                <div class="error-screen">
                    <h2>⚠️ TRUY CẬP BỊ TỪ CHỐI!</h2>
                    <p>Bạn phải vượt link từ các trang rút gọn chính thức để lấy Key.</p>
                </div>
            `;
        } else {
            const urlParams = new URLSearchParams(window.location.search);
            const provider = urlParams.get('provider') || 'default';

            // HÀM TẠO KEY RANDOM DÀI BẢO MẬT THEO NGÀY
            function generateSecureKey(prov) {
                let dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, ""); // Ví dụ: 20261011
                let secretSalt = "TRONG_KEY_SECRET_2026";
                let rawText = prov.toUpperCase() + "_" + dateStr + "_" + secretSalt;
                
                // Mã hóa băm chuỗi thành dạng HEX ngẫu nhiên dài
                let hash = 0;
                for (let i = 0; i < rawText.length; i++) {
                    hash = ((hash << 5) - hash) + rawText.charCodeAt(i);
                    hash |= 0;
                }
                let hexCode = Math.abs(hash).toString(16).toUpperCase().padStart(8, 'X');
                let subHash = Math.abs(hash * 31).toString(16).toUpperCase().padStart(4, 'Y');

                // Tạo key dài định dạng: PROV-HEX8-SUB4-DATE
                return `${prov.toUpperCase()}-${hexCode}-${subHash}-${dateStr}`;
            }

            let currentKey = generateSecureKey(provider);
            document.getElementById("key-text").innerText = currentKey;

            let timeLeft = 30;
            let isCopied = false;

            const timerInterval = setInterval(function() {
                timeLeft--;
                document.getElementById("countdown").innerText = timeLeft;
                if (timeLeft <= 0) destroyKey();
            }, 1000);

            window.copyAndDestroyKey = function() {
                if (isCopied || timeLeft <= 0) return;
                let keyText = document.getElementById("key-text").innerText;
                navigator.clipboard.writeText(keyText);
                alert("Đã sao chép Key bảo mật:\n" + keyText + "\n\n(Key sẽ tự hủy ngay lập tức!)");
                isCopied = true;
                destroyKey();
            };

            function destroyKey() {
                clearInterval(timerInterval);
                document.getElementById("key-text").style.display = "none";
                document.getElementById("copy-btn").style.display = "none";
                document.getElementById("timer-display").style.display = "none";
                document.getElementById("expired-text").style.display = "block";
            }
        }
    </script>

</body>
</html>
